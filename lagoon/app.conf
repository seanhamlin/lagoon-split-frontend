server {
  listen ${NGINX_LISTEN:-8080};
  large_client_header_buffers 4 32k;

  # Keep redirect Location headers relative so https is preserved behind the Lagoon router.
  absolute_redirect off;

  include /etc/nginx/helpers/*.conf;

  # CMS paths route to the Drupal backend.
  location ~ ^/cms(/|$) {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://${BACKEND_HOST:-nginx.zs-sean-backend-dev.svc}:${BACKEND_PORT:-8080};
  }

  # API paths route to the Drupal backend.
  location ~ ^/api(/|$) {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://${BACKEND_HOST:-nginx.zs-sean-backend-dev.svc}:${BACKEND_PORT:-8080};
  }

  # Default backend is Node.js
  location / {
    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node:3000;
  }
}